services:
  - type: web
    name: cafnet-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_DEV_MODE
        value: "true"
      - key: AUTH_DETERMINISTIC_OTP
        value: "123456"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: AUTH_SESSION_COOKIE_NAME
        value: "cafnet_session"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
